[workspace]
members = [
    "crates/phantom-core",
    "crates/phantom-crypto",
    "crates/phantom-routing",
    "crates/phantom-zkvm",
    "crates/phantom-zkvm/methods",  # RISC Zero methods package
    "crates/phantom-discovery",
    "crates/phantom-networking",
    "crates/phantom-node",
    "crates/phantom-circuit",
    "crates/phantom-simulation",  # Phase 3 network simulation framework
]

# RISC Zero guest programs MUST be excluded from workspace
# They compile to riscv32im-risc0-zkvm-elf, not the host target
exclude = [
    "crates/phantom-zkvm/methods/guest",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PHANTOM Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/phantom"
homepage = "https://phantom-protocol.org"
documentation = "https://docs.phantom-protocol.org"
keywords = ["privacy", "anonymity", "cryptography", "zero-knowledge", "fhe"]
categories = ["cryptography", "network-programming"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
bincode = "1.3"
blake3 = "1.5"

# Cryptography - Post-Quantum
pqcrypto-kyber = "0.7"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"

# Cryptography - Fully Homomorphic Encryption
tfhe = { version = "1.4", features = ["integer"], default-features = false }

# Cryptography - Zero-Knowledge
ark-std = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"

# zkVM (to be added later)
# risc0-zkvm = { version = "0.21", features = ["prove", "verify"] }
# sp1-sdk = "1.0"

# Networking
libp2p = { version = "0.53", features = ["tcp", "quic", "noise", "gossipsub", "tokio", "yamux", "macros"] }
quinn = "0.10"  # QUIC implementation

# Rate limiting / Anonymous credentials (to be added later)
# semaphore = { git = "https://github.com/semaphore-protocol/semaphore-rs" }
# rln = { git = "https://github.com/rate-limiting-nullifier/rln" }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
rand = "0.8"
rand_core = "0.6"
rayon = "1.10"  # Parallel processing for FHE batch encryption

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3  # Optimize dependencies even in dev mode (crypto is slow)
